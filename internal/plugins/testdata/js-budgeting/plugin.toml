name        = "js-budgeting"
version     = "0.1.0"
description = "Tag transactions matching a keyword (JavaScript)"
author      = "kasas tests"
runtime     = "js"
entrypoint  = "main.js"

hooks        = ["OnTransactionCreate", "OnTransactionUpdate"]
capabilities = ["transactions:read", "labels:write", "extensions:write"]

[config]
keyword = "coffee"
