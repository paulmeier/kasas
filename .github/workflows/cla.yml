# CLA Assistant Lite configuration
# https://github.com/contributor-assistant/github-action

name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token with repo scope — add to repo secrets
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/paulmeier/kasas/blob/main/CLA.md"
          branch: "main"
          allowlist: paulmeier # maintainer is exempt

          # Customize the bot message
          signed-commit-message: |
            $contributorName has signed the CLA in #$pullRequestNo
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this, please
            sign the [Contributor License Agreement](https://github.com/paulmeier/kasas/blob/main/CLA.md)
            by commenting:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```
