name: Docs

# Build the MkDocs site and publish the rendered output to the `docs` branch,
# which GitHub Pages serves. Source lives in /docs and mkdocs.yml on main.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow the job to push the built site to the `docs` branch.
permissions:
  contents: write

# Never let two deploys race the docs branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          # Pin to a stable release with wheels for all deps (avoid bleeding-edge
          # 3.x). No pip cache: we install a single pinned package inline, and
          # `cache: pip` errors without a requirements.txt / pyproject.toml.
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.7.6"
      - name: Build (strict) and deploy to the docs branch
        run: mkdocs gh-deploy --force --strict --remote-branch docs
