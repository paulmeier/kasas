name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'gofmt -w .' (or 'make fmt'):"
            echo "$files"
            echo "----- diff -----"
            gofmt -d .
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kasas
          POSTGRES_PASSWORD: kasas
          POSTGRES_DB: kasas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kasas -d kasas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Activates the gated Postgres integration test (internal/db/pgstore_test.go).
      KASAS_TEST_POSTGRES_DSN: postgres://kasas:kasas@localhost:5432/kasas?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o bin/kasas ./cmd/kasas
      - name: Smoke-test binary
        run: ./bin/kasas version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify image builds (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: kasas:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
